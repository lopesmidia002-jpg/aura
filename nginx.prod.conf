events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Otimizações de Conexão e Kernel
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compressão Gzip de Alta Eficiência
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # =========================================================================
    # 1. SERVIDOR HTTP (Porta 80) — Redirecionamento HTTPS & ACME Challenge
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name aurabeaute.com.br www.aurabeaute.com.br localhost;

        # Desafio Let's Encrypt para renovação automática de certificados SSL
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirecionamento para HTTPS em ambiente de produção com domínio ativo
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 2. SERVIDOR HTTPS (Porta 443) — Produção com HTTP/2 e Segurança Máxima
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name aurabeaute.com.br www.aurabeaute.com.br;

        root /usr/share/nginx/html;
        index index.html;

        # Certificados SSL (Let's Encrypt / Cloudflare Origin CA)
        ssl_certificate /etc/nginx/ssl/live/aurabeaute.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/aurabeaute.com.br/privkey.pem;

        # Parâmetros de Criptografia Moderna
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:AuraSSL:10m;
        ssl_session_tickets off;

        # Cabeçalhos de Segurança de Produção
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Cache de Longo Prazo para Imagens AVIF e Assets Imutáveis
        location ~* \.(avif|webp|jpg|jpeg|png|gif|ico|svg|css|js)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform, max-age=2592000";
            access_log off;
        }

        # Endpoints da API Concierge & CRM
        location /api/agendamentos {
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            if ($request_method = OPTIONS) {
                return 204;
            }
            return 200 '{"status":"success","code":200,"message":"Solicitação de agendamento VIP recebida pelo Concierge AURA Maison.","concierge":"Jardins VIP Desk","valet_included":true}';
        }

        location /api/newsletter {
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            if ($request_method = OPTIONS) {
                return 204;
            }
            return 200 '{"status":"success","code":200,"message":"Inscrição no Círculo AURA Privilège confirmada com distinção."}';
        }

        # Roteamento SPA / Static
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

