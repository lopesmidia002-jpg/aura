events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Cache headers para imagens e fontes estáticas
        location ~* \.(avif|webp|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # CSS e JS sempre revalidados para prevenir cache estagnado no navegador
        location ~* \.(css|js)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # Endpoints da API do Concierge & CRM (Execução 100% no Docker)
        location /api/agendamentos {
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            
            if ($request_method = OPTIONS) {
                return 204;
            }
            return 200 '{"status":"success","code":200,"message":"Solicitação de agendamento VIP recebida pelo Concierge AURA Maison.","concierge":"Jardins VIP Desk","valet_included":true}';
        }

        location /api/newsletter {
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            if ($request_method = OPTIONS) {
                return 204;
            }
            return 200 '{"status":"success","code":200,"message":"Inscrição no Círculo AURA Privilège confirmada com distinção."}';
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
